[project]
name = "memory-firewall"
version = "0.1.0"
description = "Provenance-aware trust boundary for agent memory and RAG: pre-write scanning, pre-retrieval ACL/trust gating, bitemporal evidence ledger and replayable poisoning lab."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Memory Firewall contributors" }]
keywords = ["rag-security", "prompt-injection", "memory-poisoning", "provenance", "ai-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.118,<0.200",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.37,<0.40",
  "python-multipart>=0.0.20,<0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<8",
  "httpx>=0.28,<0.30",
  "ruff>=0.14,<0.20",
  "mypy>=1.14,<2",
]
# Optional research extensions. NOT required for the default offline demo, tests or evals.
embeddings = ["scikit-learn>=1.6,<2", "numpy>=2.1,<3"]

[project.scripts]
memory-firewall = "memory_firewall.cli:main"

[project.urls]
Homepage = "https://github.com/example/memory-firewall"
Documentation = "https://github.com/example/memory-firewall/tree/main/docs"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/memory_firewall/memory_firewall", "apps/api/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["packages/memory_firewall", "apps/api", "."]
addopts = "-q --strict-markers --strict-config"
markers = [
  "security: deterministic security-boundary regression tests (must never be skipped)",
  "integration: real DB + real FTS5 retrieval tests",
  "slow: longer-running tests",
]
filterwarnings = ["error::DeprecationWarning:memory_firewall.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/memory_firewall", "apps/api", "evals", "scripts", "tests", "examples"]
# The four normative contract documents at the repo root are inputs, not source. Ruff 0.16 formats
# Python code blocks inside Markdown, which silently rewrote CLAUDE.md; these must stay verbatim.
extend-exclude = [
  "apps/dashboard", "private", ".venv", "data",
  "CLAUDE.md", "IMPLEMENTATION_BLUEPRINT.md", "ACCEPTANCE_EVIDENCE_MATRIX.md",
  "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = [
  "S101",     # assert: the test suites are assertion-based
  "E501",     # line length is handled by the formatter
  "RUF012",   # ClassVar annotations on mutable defaults: noise for dataclass-style config
  "N818",     # error classes are named for what they are, not with an -Error suffix
  "SIM108",   # ternaries are not always clearer than an if/else
  "B008",     # FastAPI's Depends()/Query() in defaults is the documented idiom
  # This is a project ABOUT Unicode-based attacks. Homoglyphs, zero-width characters and bidi
  # controls appear deliberately in detector rule data, test payloads and documentation. Flagging
  # them as "ambiguous" would mean annotating the subject matter itself.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608"]
"evals/**" = ["S311", "S608"]
"scripts/**" = ["S603", "S607"]
"packages/memory_firewall/memory_firewall/db.py" = ["S608"]
"packages/memory_firewall/memory_firewall/retrieval.py" = ["S608"]
"packages/memory_firewall/memory_firewall/testing.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
files = ["packages/memory_firewall/memory_firewall", "apps/api/app"]
mypy_path = "packages/memory_firewall:apps/api"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
