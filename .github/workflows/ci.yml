name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: packages/memory_firewall:apps/api:.
  MF_DB_PATH: data/ci.sqlite3

jobs:
  backend:
    name: Engine, security suite and seed vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail fast if this runner's SQLite lacks FTS5
        run: |
          python -c "import sqlite3; sqlite3.connect(':memory:').execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('FTS5 OK', sqlite3.sqlite_version)"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (pinned by uv.lock)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests (real SQLite + FTS5)
        run: uv run pytest tests/integration -q

      - name: Security regression suite
        run: uv run pytest tests/security -q

      # A quietly skipped security test is a release blocker, not a pass. This job fails if the
      # security suite ran zero tests or skipped any.
      - name: Assert no security test was skipped
        run: uv run python scripts/assert_no_skipped_security.py

      - name: Release seed vectors (TEST_VECTORS.json)
        run: uv run pytest tests/integration/test_release_vectors.py -q

      - name: Offline scenarios
        run: uv run python -m memory_firewall.cli scenarios

      - name: Mandatory smoke
        run: uv run python -m memory_firewall.cli smoke

      - name: Examples actually run
        run: |
          uv run python examples/sdk_quickstart.py
          uv run python examples/support_copilot/copilot.py

      - name: Evaluation (4 conditions over the labelled dataset)
        run: uv run python -m evals.runner

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-scorecard
          path: evals/results/RESULTS.*

  frontend:
    name: Dashboard typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `npm ci` once a package-lock.json exists; `npm install` until then (see
      # apps/dashboard/package.json "comment" for why no lockfile is committed yet). The single
      # devDependency is pinned to an exact version, so this is reproducible in practice.
      - name: Install
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/dashboard
        run: npm run typecheck
      - name: Build
        working-directory: apps/dashboard
        run: npm run build

  e2e:
    name: Browser end-to-end against the running app
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pip install playwright && uv run playwright install --with-deps chromium
      - name: Build the dashboard
        working-directory: apps/dashboard
        run: (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) && npm run build
      - name: Seed the demo database
        run: uv run python -m memory_firewall.cli setup-demo
      - name: Start the stack
        run: ./scripts/devstack.sh start
      - name: Browser assertions
        run: uv run python scripts/run_e2e.py
      - name: Stop the stack
        if: always()
        run: ./scripts/devstack.sh stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: docs/assets/e2e-report.json

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: memory-firewall-api:ci
      - name: Build the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: memory-firewall-dashboard:ci

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: private/ must be ignored and nothing sensitive tracked
        run: |
          set -e
          git check-ignore private/Memory_Firewall_Research_Interview_Guide.pdf
          test -z "$(git ls-files private/)"  || { echo "files tracked under private/"; exit 1; }
          test -z "$(git ls-files '.env')"    || { echo ".env is tracked"; exit 1; }
          test -z "$(git ls-files '*.sqlite3')" || { echo "a database is tracked"; exit 1; }
          echo "hygiene OK"
